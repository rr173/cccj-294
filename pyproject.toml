[project]
name = "eight-player-knockout"
version = "1.0.0"
description = "Eight-player single-elimination tournament service with appeal adjudication"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
